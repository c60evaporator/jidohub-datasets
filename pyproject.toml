[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jidohub-datasets"
version = "0.1.0"
description = "jidohub: データセット固有の形式を標準スキーマ（Sample / Detection3DOutput）へ正規化する"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "jidohub" }]
keywords = ["autonomous-driving", "dataset", "nuscenes", "jidohub"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
# torch は入れない。データセットの読み込みに学習フレームワークは不要であり、
# torch なしで可視化・変換できることがプラットフォーム全体の前提（CLAUDE.md 1 章）。
dependencies = [
    # PyPI 未公開。素の名前＋緩い下限で書く（VCS URL の直接参照は書かない。CLAUDE.md 1 章）。
    "jidohub-core>=0.1",
    "numpy",
    "pillow",
]

[project.optional-dependencies]
# devkit は optional。conversions.py は devkit 非依存で、変換ロジックの
# ユニットテスト（tests/test_conversions.py）は devkit なしで通る。
nuscenes = ["nuscenes-devkit"]
dev = ["pytest", "pytest-cov", "ruff", "mypy"]

[tool.hatch.build.targets.wheel]
# PEP 420 namespace package。src/jidohub/__init__.py は存在させない。
packages = ["src/jidohub"]

[tool.hatch.build.targets.wheel.force-include]
"src/jidohub/datasets/py.typed" = "jidohub/datasets/py.typed"

[tool.hatch.build.targets.sdist]
include = [
    "src/jidohub",
    "scripts",
    "README.md",
    "CLAUDE.md",
    "pyproject.toml",
]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I"]
# 行長は formatter が管理する。E501 は formatter が折り返せない文字列・コメント
# （日本語 docstring 等）だけを誤って咎めるため無効化する（core と同方針）。
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
# 型チェックの対象バージョンは 3.12（core と同じ。numpy>=2.3 の型スタブが
# PEP 695 の `type` 文を使うため）。ランタイムの 3.10 互換は pytest マトリクスで担保。
python_version = "3.12"
disallow_untyped_defs = true
ignore_missing_imports = true
mypy_path = "src"
explicit_package_bases = true
namespace_packages = true
files = ["src", "tests", "scripts"]

[[tool.mypy.overrides]]
# numpy 配列演算は型注釈が付けきれないため、変換モジュールに限定して緩和する。
# 全体無効化はしない（CLAUDE.md 2.1）。
module = ["jidohub.datasets.nuscenes.conversions"]
disable_error_code = ["no-any-return", "index", "arg-type", "assignment"]

[[tool.mypy.overrides]]
# テストは fixture 引数が未注釈で、スキーマの Optional フィールドへのアクセスで
# union-attr が多発する。テストでは型定義の厳格さを求めない。
module = ["tests.*", "conftest", "make_fixtures"]
disallow_untyped_defs = false
disable_error_code = ["union-attr", "arg-type", "index"]
