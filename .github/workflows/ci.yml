name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install jidohub-core
        # core は PyPI 未公開のため、同一 org のリポジトリから入れる。
        # PyPI 公開後は `pip install jidohub-core` に置き換える。
        run: python -m pip install "jidohub-core @ git+https://github.com/${{ github.repository_owner }}/jidohub-core.git"

      - name: Install (dev のみ; nuscenes-devkit は入れない)
        # devkit を入れずに全テストが通ること = conversions / adapter が
        # devkit 非依存であることの検証（CLAUDE.md 2.1 / 依頼書 完了条件 3）。
        run: python -m pip install -e '.[dev]'

      - name: ruff check
        run: ruff check .

      - name: ruff format --check
        run: ruff format --check .

      - name: mypy
        run: mypy

      - name: pytest
        run: pytest
